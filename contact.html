<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Contact</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(180deg, #111 0%, #0f0f0f 100%);
        color: #eaeaea;
        padding-top: 70px;
        font-family: 'Poppins', sans-serif;
        line-height: 1.7;
      }

      h1,
      h2,
      h3 {
        color: #d4b46a;
      }
      /* FORCE TEXT COLOR */
      body,
      p,
      span,
      li,
      label,
      small {
        color: #eaeaea !important;
      }

      /* CARD TEXT */
      .card p,
      .card h5,
      .card h6 {
        color: #f0f0f0;
      }

      /* BUTTON TEXT */
      .btn-warning {
        color: #111 !important;
      }

      /* FORM TEXT */
      input,
      textarea {
        color: #f5f5f5 !important;
      }

      /* PLACEHOLDER */
      ::placeholder {
        color: #aaa !important;
      }

      .text-muted {
        color: #9a9a9a !important;
      }

      .navbar {
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(6px);
      }

      .navbar-brand {
        color: #d4b46a !important;
        letter-spacing: 1px;
      }

      .nav-link {
        color: #eaeaea !important;
      }

      .nav-link.active,
      .nav-link:hover {
        color: #d4b46a !important;
      }

      .card {
        background: #161616;
        border: 1px solid #222;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      }

      .divider {
        width: 70px;
        height: 3px;
        background: linear-gradient(90deg, #c9a14a, #f5d78e);
        margin: 16px auto 24px;
      }

      .form-control {
        background: #161616;
        border: 1px solid #2a2a2a;
        color: #eaeaea;
      }

      .form-control::placeholder {
        color: #888;
      }

      .form-control:focus {
        background: #161616;
        border-color: #d4b46a;
        box-shadow: none;
        color: #fff;
      }

      .btn-warning {
        background: linear-gradient(135deg, #c9a14a, #f5d78e);
        border: none;
        color: #000;
        font-weight: 600;
      }

      footer {
        background: #0a0a0a;
        color: #9a9a9a;
        margin-top: 80px;
        padding: 25px 0;
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">hjAppanCut</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="services.html">Services</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="gallery.html">Gallery</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- CONTACT -->
    <div class="container py-5">
      <h2 class="text-center">Hubungi Kami</h2>
      <div class="divider"></div>

      <div class="row g-4 mt-4">
        <div class="col-md-6">
          <div class="card p-4">
            <input class="form-control mb-3" placeholder="Nama" />
            <input class="form-control mb-3" placeholder="Email" />
            <textarea
              class="form-control mb-3"
              rows="4"
              placeholder="Pesan"
            ></textarea>
            <button class="btn btn-warning w-100">Kirim Pesan</button>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card p-4">
            <h5 class="mb-3">Informasi Kontak</h5>
            <p>Email: hjappancut@gmail.com</p>
            <p>Telp / WhatsApp: 088888888888</p>
            <p>Alamat: Jl. Gajah No. 12 Semarang, Jawa Tengah</p>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="text-center">
      <small>© 2026 hjAppanCut Barbershop</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
